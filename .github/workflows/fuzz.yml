name: Fuzz

# Fuzzes each target for ten minutes every week, and on demand, against main.
# The corpus is kept between runs, so each run starts where the last one
# stopped. A crash fails the run, uploads the input that caused it, and opens
# (or comments on) an issue. Turn each crash into a seed or unit test when
# fixing it, so the ordinary tests guard against it on every pull request.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz each target, in seconds.
        type: number
        default: 600

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [lex]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fuzz tools
        run: |
          rustup toolchain install nightly-2026-09-24 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 600 }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly-2026-09-24 fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_EACH" -max_len=512 -timeout=2 -rss_limit_mb=1024
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
          if-no-files-found: ignore

  report:
    name: Report a crash
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the fuzzing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fuzzing found a crash"
          body="A fuzz run failed: $RUN_URL. The crashing input is attached to the run as an artifact. Reproduce it with cargo +nightly-2026-09-24 fuzz run <target> <file>, fix it, and add the input as a seed or unit test."
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
