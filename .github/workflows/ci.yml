name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, Clippy, coverage (the Linux test run), a build and test on macOS
  # and Windows, and workflow lint, shared by every 198x Rust repo
  # (stevehill1981/198x-workflows).
  rust:
    name: Rust
    uses: stevehill1981/198x-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # Every Z80 dialect will rest on this parser. Ratchet up as tests grow;
      # never down.
      coverage-floor: 95
      # Lowering to asm198x-ir sits behind the `ir` feature. Clippy and the
      # tests run with it as well as without, and coverage counts it.
      all-features: true
      coverage-args: --all-features

  # The parser, preprocessing and views must build without any Asm198x or
  # Isa198x crate, so tools that need only the tree stay self-contained. The
  # second check proves the first can fail.
  separation:
    name: Default build has no Asm198x crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the default and ir dependency trees
        run: |
          tree() { cargo tree -p lang198x-z80-asm -e normal --prefix none --format '{p}' "$@"; }
          if tree | grep -E '^(asm198x-|isa198x )'; then
            echo "The default build depends on an Asm198x or Isa198x crate." >&2
            exit 1
          fi
          tree --features ir | grep -q '^asm198x-ir ' || {
            echo "The ir build has no asm198x-ir, so this check would pass on anything." >&2
            exit 1
          }

  # Pull requests do not fuzz: a time-boxed run is not repeatable, so it could
  # fail a pull request that did not cause the problem. Fuzzing runs weekly in
  # fuzz.yml instead, and every crash it finds becomes a seed or unit test that
  # the ordinary tests run here. This job only keeps the fuzz targets building
  # against the current API, with an up-to-date lockfile.
  fuzz-targets:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A release raises this crate's own version, which the fuzz lockfile
      # also records. Only that entry is brought in line before the --locked
      # check, so drift in any other dependency still fails.
      - name: Check the fuzz targets build
        run: |
          version=$(cargo pkgid --manifest-path crates/z80-asm/Cargo.toml | sed 's/.*[@#]//')
          sed -i "/^name = \"lang198x-z80-asm\"\$/{n;s/^version = .*/version = \"$version\"/}" fuzz/Cargo.lock
          cargo check --manifest-path fuzz/Cargo.toml --locked --bins
