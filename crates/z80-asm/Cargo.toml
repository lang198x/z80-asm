[package]
name = "lang198x-z80-asm"
description = "The Z80 assembler family for Lang198x: one lossless parser for PasmoNext and the Z80 assemblers like it, a profile per dialect, lowering to asm198x-ir."
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["z80", "assembler", "parser", "retro", "zx-spectrum"]
categories = ["parsing"]

[features]
# Lowering to asm198x-ir, for the Asm198x back end. Off by default, so tools
# that need only the tree build without any Asm198x crate.
ir = ["dep:asm198x-ir", "dep:isa198x"]

[dependencies]
lang198x-syntax = "0.1.2"
# A range, not ^0.0.72: Asm198x patches this to its own workspace copy, so
# its releases must still match. CI resolves the newest, so a break shows.
asm198x-ir = { version = ">=0.0.72, <0.1", optional = true }
# The instruction forms lowering chooses from; asm198x-ir names its types.
isa198x = { version = "0.1.7", optional = true }

[dev-dependencies]
# Generated tests only, as approved in the shared syntax layer decision.
proptest = "1.12.0"

[lints]
workspace = true
