[package]
name = "lang198x-z80-asm"
description = "The Z80 assembler family for Lang198x: one lossless parser for PasmoNext and the Z80 assemblers like it, a profile per dialect, lowering to asm198x-ir."
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["z80", "assembler", "parser", "retro", "zx-spectrum"]
categories = ["parsing"]
# Not published until the parser does something; the first publish is by hand.
publish = false

[dependencies]
lang198x-syntax = "0.1.1"

[dev-dependencies]
# Generated tests only, as approved in the shared syntax layer decision.
proptest = "1.12.0"

[lints]
workspace = true
